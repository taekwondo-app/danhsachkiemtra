<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#1e40af">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content=
"Đăng ký danh sách ">  <title>Đăng ký danh sách kiểm tra</title>
 <link rel="icon" type="image/png" href="logo.png">
  <link rel="apple-touch-icon" href="logo.png">
  <link rel="manifest" href="manifest.json">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { 
      height: 100%; 
      overflow: hidden; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f8fafc; 
    }

    /* ========== LOADER ========== */
    #loader {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }
    .app-logo {
      width: 80px; height: 80px;
      margin-bottom: 20px;
      border-radius: 18px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      object-fit: cover;
    }
    .spinner {
      width: 36px; height: 36px;
      border: 3.5px solid #e2e8f0;
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    .loading-text {
      margin-top: 14px;
      font-size: 14px;
      color: #64748b;
      font-weight: 500;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loader.hidden {
      opacity: 0;
      visibility: hidden;
    }

    /* ========== IFRAME ========== */
    iframe {
      width: 100%; height: 100%;
      border: none;
      display: block;
    }



  <!-- LOADER -->
  <div id="loader">
    <img src="logo.png" alt="Logo" class="app-logo" onerror="this.style.display='none'">
    <div class="spinner"></div>
    <div class="loading-text">Đang tải dữ liệu...</div>
  </div>

  <!-- IFRAME ỨNG DỤNG -->
  <iframe 
    id="app-iframe"
    src="https://script.google.com/macros/s/AKfycbwzAqJlekMj8mofDfia9z7fXK8ZQDs4Tzs0obu4HKV7ky2e2qOcl6YuECxc2_MaBOQwnQ/exec" 
    allow="fullscreen"
    loading="eager"
    onload="hideLoader()">
  </iframe>

  <!-- NÚT CÀI ĐẶT (Chrome / Android / Edge) -->
  <button id="install-banner">
    <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
    Cài đặt ứng dụng
  </button>

  <!-- HƯỚNG DẪN CÀI TRÊN iOS (Safari) -->
  <div id="ios-guide">
    <h3>Cài đặt ứng dụng trên iPhone / iPad</h3>
    <p>Nhấn nút <strong>Chia sẻ</strong> → chọn <strong>Thêm vào Màn hình chính</strong></p>
    <div class="steps">
      <div class="step">
        <div class="step-icon">⬆️</div>
        <span>Chia sẻ</span>
      </div>
      <div class="step">
        <div class="step-icon">➕</div>
        <span>Thêm vào<br>Màn hình chính</span>
      </div>
    </div>
    <button onclick="document.getElementById('ios-guide').style.display='none'">Đã hiểu</button>
  </div>

  <script>
    // ========== ẨN LOADER ==========
    function hideLoader() {
      const loader = document.getElementById('loader');
      if (loader) loader.classList.add('hidden');
    }
    setTimeout(hideLoader, 8000); // dự phòng

   
    

    
  </script>
</body>
</html>
